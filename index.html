<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard produktivitas harian: to-do list, focus timer, dan quick links dalam satu halaman." />
  <meta name="theme-color" content="#0f0f0f" />
  <meta property="og:title" content="Life Dashboard — Produktivitas Harianmu" />
  <meta property="og:description" content="Kelola tugas, fokus dengan timer Pomodoro, dan akses link favorit dengan cepat." />
  <meta property="og:type" content="website" />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="dark">

  <!-- Custom Cursor -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
    <span class="toggle-icon" id="themeIcon">☀</span>
  </button>

  <div id="nameModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Hei, siapa namamu?</h2>
      <p>Biar sapaan harianmu terasa lebih personal.</p>
      <div class="modal-input-wrap">
        <label for="nameInput" class="sr-only">Nama kamu</label>
        <input type="text" id="nameInput" placeholder="Masukkan namamu..." autocomplete="given-name" maxlength="30" />
        <button id="saveName">Simpan</button>
      </div>
    </div>
  </div>

  <main>
    <section class="greeting-section" aria-label="Sapaan dan waktu">
      <div class="time-display" id="clock" aria-live="polite">00:00:00</div>
      <div class="date-display" id="dateDisplay"></div>
      <h1 class="greeting-text" id="greeting"></h1>
      <button class="change-name-btn" id="changeName" aria-label="Ganti nama">✎ Ganti nama</button>
    </section>

    <div class="dashboard-grid">

      <section class="card timer-card" aria-label="Focus Timer">
        <div class="card-header">
          <h2>Focus Timer</h2>
          <div class="duration-select-wrap">
            <label for="durationSelect" class="sr-only">Pilih durasi</label>
            <select id="durationSelect" aria-label="Pilih durasi timer">
              <option value="5">5 mnt</option>
              <option value="10">10 mnt</option>
              <option value="15">15 mnt</option>
              <option value="25" selected>25 mnt</option>
              <option value="30">30 mnt</option>
              <option value="45">45 mnt</option>
              <option value="60">60 mnt</option>
            </select>
          </div>
        </div>
        <div class="timer-display" id="timerDisplay" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="timer-progress">
          <div class="timer-bar" id="timerBar"></div>
        </div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="timerStart">Mulai</button>
          <button class="btn btn-ghost" id="timerStop">Berhenti</button>
          <button class="btn btn-ghost" id="timerReset">Reset</button>
        </div>
      </section>

      <section class="card todo-card" aria-label="Daftar Tugas">
        <h2>Tugas</h2>
        <div class="todo-input-wrap">
          <label for="todoInput" class="sr-only">Tambah tugas baru</label>
          <input type="text" id="todoInput" placeholder="Tambah tugas baru..." maxlength="100" />
          <button class="btn btn-primary" id="todoAdd" aria-label="Tambah tugas">+</button>
        </div>
        <div class="todo-filters">
          <button class="filter-btn active" data-filter="all">Semua</button>
          <button class="filter-btn" data-filter="active">Aktif</button>
          <button class="filter-btn" data-filter="done">Selesai</button>
        </div>
        <ul id="todoList" aria-label="Daftar tugas" role="list"></ul>
        <div class="todo-footer" id="todoFooter"></div>
      </section>

      <section class="card links-card" aria-label="Quick Links">
        <h2>Quick Links</h2>
        <div class="link-input-wrap">
          <label for="linkName" class="sr-only">Nama link</label>
          <input type="text" id="linkName" placeholder="Nama link..." maxlength="20" />
          <label for="linkUrl" class="sr-only">URL link</label>
          <input type="url" id="linkUrl" placeholder="https://..." maxlength="200" />
          <button class="btn btn-primary" id="linkAdd" aria-label="Tambah link">+</button>
        </div>
        <div id="linkGrid" class="link-grid" role="list"></div>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
